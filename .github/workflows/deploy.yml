name: Obfuscate, Minify & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - add-obfuscator
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy site files to dist
        run: |
          rm -rf dist
          mkdir dist
          cp -r src/. dist/

      - name: Obfuscate JavaScript
        uses: KevinRohn/github-action-javascript-obfuscator@v1
        with:
          input_path: src/js
          output_path: dist/js
          options_preset: medium-obfuscation
          target: browser
          compact: true

      - name: Minify HTML, CSS and JS
        uses: docker://devatherock/minify-js:3.1.0
        with:
          directory: dist
          add_suffix: false
          inclusions: |-
            .*\.(html|css|js)$

      # 테스트 브랜치: 결과물을 아티팩트로 내려받아 로컬에서 확인
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.ref_name }}
          path: dist

      # main 브랜치에서만 Pages용 아티팩트 생성
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
